openapi: 3.0.3
info:
  title: Slotwise API
  version: 1.0.0
  description: Workspace-scoped resource bookings with conflict protection and idempotent
    creation.
paths:
  /api/bookings/:
    get:
      operationId: bookings_list
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
    post:
      operationId: bookings_create
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBooking'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Booking'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/resources/:
    get:
      operationId: resources_list
      tags:
      - resources
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
          description: ''
    post:
      operationId: resources_create
      tags:
      - resources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Resource'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Resource'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
  /api/resources/{id}/:
    get:
      operationId: resources_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resource.
        required: true
      tags:
      - resources
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
    patch:
      operationId: resources_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resource.
        required: true
      tags:
      - resources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResource'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResource'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResource'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/session/:
    get:
      operationId: session_retrieve
      tags:
      - session
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
components:
  schemas:
    AmenitiesEnum:
      enum:
      - Wi-Fi
      - Display
      - Whiteboard
      - Video calls
      - Natural light
      - Quiet zone
      type: string
      description: |-
        * `Wi-Fi` - Wi-Fi
        * `Display` - Display
        * `Whiteboard` - Whiteboard
        * `Video calls` - Video calls
        * `Natural light` - Natural light
        * `Quiet zone` - Quiet zone
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resource:
          type: string
          format: uuid
          readOnly: true
        resource_name:
          type: string
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        attendees:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        can_cancel:
          type: boolean
          readOnly: true
      required:
      - attendees
      - can_cancel
      - cancelled_at
      - created_at
      - ends_at
      - id
      - owner_id
      - owner_name
      - resource
      - resource_name
      - starts_at
      - status
      - title
    CreateBooking:
      type: object
      properties:
        resource:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        attendees:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - attendees
      - date
      - end_time
      - resource
      - start_time
      - title
    KindEnum:
      enum:
      - room
      - desk
      - studio
      type: string
      description: |-
        * `room` - Meeting room
        * `desk` - Desk
        * `studio` - Studio
    PatchedResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        capacity:
          type: integer
          maximum: 100
          minimum: 1
        floor:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 300
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/AmenitiesEnum'
          maxItems: 6
        active:
          type: boolean
    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        capacity:
          type: integer
          maximum: 100
          minimum: 1
        floor:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 300
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/AmenitiesEnum'
          maxItems: 6
        active:
          type: boolean
      required:
      - capacity
      - id
      - name
    Session:
      type: object
      properties:
        user:
          nullable: true
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
      required:
      - user
      - workspaces
    StatusEnum:
      enum:
      - confirmed
      - cancelled
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 64
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
        role:
          type: string
          readOnly: true
      required:
      - id
      - name
      - role
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
